name: Build

on:
  push:
    branches: [master-patches]
  pull_request:

permissions:
  contents: read

# The sancov plugin needs the LLVM version production builds with.
# Noble's llvm-dev is 18, which lacks the APIs the plugin uses.
# The apt.llvm.org key fingerprint is published at https://apt.llvm.org.
env:
  LLVM_VERSION: 21
  LLVM_CONFIG: llvm-config-21
  HFUZZ_CC_PATH: clang-21
  LLVM_APT_KEY_FPR: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo install -d /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          gpg --show-keys --with-colons /etc/apt/keyrings/apt.llvm.org.asc | grep -q "^fpr:::::::::$LLVM_APT_KEY_FPR:"
          codename=$(lsb_release -cs)
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          sudo apt-get update
          sudo apt-get install -y gcc g++ make pkg-config libunwind-dev binutils-dev python3 clang-$LLVM_VERSION llvm-$LLVM_VERSION-dev

      - name: Build honggfuzz
        run: make -j$(nproc)

      - name: Build honggfuzz with metrics bridge
        run: |
          make clean
          make -j$(nproc) SOLFUZZ_METRICS_ENABLED=1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo install -d /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          gpg --show-keys --with-colons /etc/apt/keyrings/apt.llvm.org.asc | grep -q "^fpr:::::::::$LLVM_APT_KEY_FPR:"
          codename=$(lsb_release -cs)
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          sudo apt-get update
          sudo apt-get install -y gcc g++ make pkg-config libunwind-dev binutils-dev python3 clang-$LLVM_VERSION llvm-$LLVM_VERSION-dev

      - name: Build honggfuzz
        run: make -j$(nproc)

      - name: Build post-mutation writeback test
        run: cc -std=c11 -o tests/test_postmut_writeback tests/test_postmut_writeback.c

      - name: Run post-mutation writeback test
        run: ./tests/test_postmut_writeback

      - name: Build crossover invariants test
        run: cc -std=c11 -o tests/test_crossover_invariants tests/test_crossover_invariants.c

      - name: Run crossover invariants test
        run: ./tests/test_crossover_invariants

      - name: Run replay mode test
        run: bash tests/test_replay.sh
